<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Aroma Palace</title>
    <style>
        html, body { margin: 0; height: 100%; background: #4A070B; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; text-align: center; }
        img { width: 112px; height: 112px; border-radius: 50%; margin-bottom: 24px; }
        h1 { font-size: 20px; margin: 0 0 8px; }
        p { font-size: 14px; line-height: 1.5; margin: 0 0 24px; color: rgba(255, 255, 255, .8); max-width: 320px; }
        button { background: #E5A844; color: #4A070B; border: 0; border-radius: 999px; padding: 12px 28px; font-size: 15px; font-weight: 600; }
    </style>
</head>
<body>
    <main>
        <img src="logo.png" alt="Aroma Palace">
        <h1>Tidak ada koneksi internet</h1>
        <p>Periksa Wi-Fi atau data seluler Anda, lalu coba lagi.<br><small>No internet connection. Please check your network and try again.</small></p>
        <button type="button" id="retry">Coba Lagi</button>
    </main>
    <script src="server-url.js"></script>
    <script>
        var target = window.APP_SERVER_URL || (window.Capacitor && window.Capacitor.getServerUrl && window.Capacitor.getServerUrl()) || '/';
        function retry() { window.location.replace(target); }
        document.getElementById('retry').addEventListener('click', retry);
        window.addEventListener('online', retry);
    </script>
</body>
</html>
